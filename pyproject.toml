[project]
name = "reelbarrow"
# Written by release-please; see docs/releasing.md.
version = "0.3.0"
description = "Files ripped discs into an archival video library"
license = "MIT"
requires-python = ">=3.13"
dependencies = ["fastapi>=0.115", "pydantic-settings>=2.6", "uvicorn>=0.32"]

[project.scripts]
reelbarrow = "reelbarrow.cli:main"

[dependency-groups]
dev = ["httpx>=0.28", "pytest>=8.3", "pytest-xdist>=3.8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Across the CPUs; `-n 0` runs in one process, for a debugger.
addopts = "-n auto"

[tool.ruff.lint]
extend-select = ["B", "I", "UP"]
