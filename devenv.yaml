inputs:
  git-hooks:
    url: github:cachix/git-hooks.nix
    inputs:
      nixpkgs:
        follows: nixpkgs
  nixpkgs:
    url: github:cachix/devenv-nixpkgs/rolling
  treefmt-nix:
    url: github:numtide/treefmt-nix
    inputs:
      nixpkgs:
        follows: nixpkgs
# secretspec.toml's secrets go only to the command that needs them, through
# `secretspec run`, never into the shell, so devenv doesn't load them.
secretspec:
  enable: false
