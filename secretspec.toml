# The secrets reelbarrow reads from its environment, for local use: each is
# stored once in a provider (the system keyring unless configured otherwise)
# with `secretspec set <NAME>`, and given only to the command that needs it
# with `secretspec run -- <command>`. The tests need none: they replay recorded
# replies. The deployment's values are in the deployment repository.
[project]
# Named rather than taken from the directory, so every worktree shares one
# stored value.
name = "reelbarrow"
revision = "1.0"

[profiles.default]
REELBARROW_TMDB_TOKEN = { description = "TMDB's API Read Access Token (not the v3 API key), from https://www.themoviedb.org/settings/api", required = true }
REELBARROW_FANART_KEY = { description = "fanart.tv's personal API key, from https://fanart.tv/get-an-api-key/", required = false }

# The system keyring, so no per-user configuration is needed first.
[providers]
keyring = "keyring://"

[profiles.default.defaults]
providers = ["keyring"]
